name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Match tag to package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a verified SSH-signed annotated tag on main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<< "$tag_ref")" = tag
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<< "$tag_ref")")"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg message "Release $VERSION" \
            '.tag == $tag
              and .message == ($message + "\n" + .verification.signature)
              and .object.type == "commit"
              and .verification.verified
              and .verification.reason == "valid"
              and (.verification.signature | startswith("-----BEGIN SSH SIGNATURE-----"))' \
            <<< "$tag_object"
          test "$(jq -r '.object.sha' <<< "$tag_object")" = \
            "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

  phase6:
    name: Phase 6 gates
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-testpypi:
    name: Publish TestPyPI
    needs: [validate-release, phase6]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/portunusmcp-sentinel/${{ needs.validate-release.outputs.version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download canonical distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portunusmcp-sentinel-dist
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: "true"
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: "true"

  verify-testpypi:
    name: Verify TestPyPI
    needs: [validate-release, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
          enable-cache: true

      - name: Install pipx
        run: python -m pip install pipx==1.16.0

      - name: Download canonical distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portunusmcp-sentinel-dist
          path: canonical-dist

      - name: Poll TestPyPI for wheel and sdist
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          mkdir testpypi-dist
          python - "$VERSION" <<'PY'
          import json
          import sys
          import time
          import urllib.request
          from pathlib import Path

          version = sys.argv[1]
          endpoint = f"https://test.pypi.org/pypi/portunusmcp-sentinel/{version}/json"
          destination = Path("testpypi-dist")
          for attempt in range(20):
              for path in destination.iterdir():
                  path.unlink()
              try:
                  with urllib.request.urlopen(endpoint) as response:
                      files = json.load(response)["urls"]
                  names = {item["filename"] for item in files}
                  if (
                      len(files) != 2
                      or sum(name.endswith(".whl") for name in names) != 1
                      or sum(name.endswith(".tar.gz") for name in names) != 1
                  ):
                      raise ValueError(f"Expected one wheel and one sdist, found {names}")
                  for item in files:
                      filename = item["filename"]
                      if Path(filename).name != filename:
                          raise ValueError(f"Unsafe TestPyPI filename: {filename}")
                      urllib.request.urlretrieve(item["url"], destination / filename)
              except (OSError, KeyError, ValueError) as error:
                  if attempt == 19:
                      raise SystemExit("TestPyPI files unavailable after five minutes") from error
                  time.sleep(15)
              else:
                  break
          PY

      - name: Match canonical filenames and SHA-256 hashes
        shell: bash
        run: |
          (cd canonical-dist && sha256sum *) > expected.sha256
          (cd testpypi-dist && sha256sum --check ../expected.sha256)

      - name: Verify TestPyPI provenance
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          python - "$VERSION" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request
          from pathlib import Path

          version = sys.argv[1]
          endpoint = f"https://test.pypi.org/pypi/portunusmcp-sentinel/{version}/json"
          with urllib.request.urlopen(endpoint) as response:
              release = json.load(response)
          expected = {path.name for path in Path("testpypi-dist").iterdir()}
          urls = {item["filename"]: item["url"] for item in release["urls"]}
          if set(urls) != expected:
              raise SystemExit(f"TestPyPI files differ: expected {expected}, found {set(urls)}")
          for item in release["urls"]:
              artifact = Path("testpypi-dist", item["filename"])
              with artifact.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if digest != item["digests"]["sha256"]:
                  raise SystemExit(f"TestPyPI reported the wrong hash for {artifact.name}")
              provenance_url = (
                  "https://test.pypi.org/integrity/portunusmcp-sentinel/"
                  f"{version}/{artifact.name}/provenance"
              )
              urllib.request.urlretrieve(provenance_url, f"{artifact}.provenance")
          PY
          for artifact in testpypi-dist/*.whl testpypi-dist/*.tar.gz; do
            uvx --from pypi-attestations==0.0.30 pypi-attestations verify pypi \
              --repository https://github.com/BashaarJavaid/MCP-Sentinel \
              --provenance-file "$artifact.provenance" "$artifact"
          done

      - name: Smoke-test downloaded TestPyPI artifacts
        run: python scripts/smoke_wheel.py artifacts testpypi-dist --install-sdist

      - name: Install downloaded TestPyPI wheel
        run: python -m pip install testpypi-dist/*.whl

      - name: Run vulnerable replay and validate findings
        shell: bash
        run: |
          sentinel demo --replay-review --output-dir vulnerable-results
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinel.report.validate_json import validate_report_data

          report = json.loads(Path("vulnerable-results/report.json").read_text(encoding="utf-8"))
          validate_report_data(report)
          assert report["analysisComplete"] is True
          assert report["executionSuccessful"] is True
          assert {finding["rule_id"] for finding in report["findings"]} == {
              f"SENT-{number:03d}" for number in range(1, 12)
          }
          PY
          python -m sentinel.report.validate_sarif vulnerable-results/report.sarif

      - name: Run clean-fixture JSON and SARIF scans
        shell: bash
        run: |
          sentinel scan tests/fixtures/clean_server --format json --output clean.json
          sentinel scan tests/fixtures/clean_server --format sarif --output clean.sarif
          python - <<'PY'
          import json
          from pathlib import Path
          from sentinel.report.validate_json import validate_report_data

          report = json.loads(Path("clean.json").read_text(encoding="utf-8"))
          validate_report_data(report)
          assert report["analysisComplete"] is True
          assert report["executionSuccessful"] is True
          assert report["findings"] == []
          PY
          python -m sentinel.report.validate_sarif clean.sarif

  publish-pypi:
    name: Publish PyPI
    needs: [validate-release, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/portunusmcp-sentinel/${{ needs.validate-release.outputs.version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download canonical distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portunusmcp-sentinel-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: "true"
          packages-dir: dist
          skip-existing: "false"

  verify-provenance:
    name: Verify provenance
    needs: [validate-release, publish-pypi]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
          enable-cache: true

      - name: Install pipx
        run: python -m pip install pipx==1.16.0

      - name: Download canonical distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portunusmcp-sentinel-dist
          path: canonical-dist

      - name: Download public wheel and sdist
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          mkdir pypi-dist
          python - "$VERSION" <<'PY'
          import json
          import sys
          import urllib.request
          from pathlib import Path

          version = sys.argv[1]
          endpoint = f"https://pypi.org/pypi/portunusmcp-sentinel/{version}/json"
          with urllib.request.urlopen(endpoint) as response:
              files = json.load(response)["urls"]
          names = {item["filename"] for item in files}
          if (
              len(files) != 2
              or sum(name.endswith(".whl") for name in names) != 1
              or sum(name.endswith(".tar.gz") for name in names) != 1
          ):
              raise SystemExit(f"Expected one wheel and one sdist, found {names}")
          for item in files:
              filename = item["filename"]
              if Path(filename).name != filename:
                  raise SystemExit(f"Unsafe PyPI filename: {filename}")
              urllib.request.urlretrieve(item["url"], Path("pypi-dist", filename))
          PY

      - name: Match canonical filenames and SHA-256 hashes
        shell: bash
        run: |
          (cd canonical-dist && sha256sum *) > expected.sha256
          (cd pypi-dist && sha256sum --check ../expected.sha256)

      - name: Download and verify PyPI provenance
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          python - "$VERSION" <<'PY'
          import sys
          import urllib.request
          from pathlib import Path

          version = sys.argv[1]
          artifacts = (*Path("pypi-dist").glob("*.whl"), *Path("pypi-dist").glob("*.tar.gz"))
          for artifact in artifacts:
              provenance_url = (
                  "https://pypi.org/integrity/portunusmcp-sentinel/"
                  f"{version}/{artifact.name}/provenance"
              )
              urllib.request.urlretrieve(provenance_url, f"{artifact}.provenance")
          PY
          for artifact in pypi-dist/*.whl pypi-dist/*.tar.gz; do
            uvx --from pypi-attestations==0.0.30 pypi-attestations verify pypi \
              --repository https://github.com/BashaarJavaid/MCP-Sentinel \
              --provenance-file "$artifact.provenance" "$artifact"
          done

      - name: Verify public metadata and artifacts
        run: python scripts/smoke_wheel.py artifacts pypi-dist

  verify-public-installs:
    name: Public install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [validate-release, publish-pypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
          enable-cache: true

      - name: Install pipx
        run: python -m pip install pipx==1.16.0

      - name: Verify exact-version pipx and uv installs
        run: >-
          python scripts/smoke_wheel.py index
          portunusmcp-sentinel==${{ needs.validate-release.outputs.version }}
