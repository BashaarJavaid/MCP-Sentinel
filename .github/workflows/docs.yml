name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v7
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Install locked documentation dependencies
        run: uv sync --locked --extra docs
      - name: Build documentation strictly
        run: uv run --extra docs mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the live documentation
        shell: bash
        run: |
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          base="${{ steps.deployment.outputs.page_url }}"
          deadline=$((SECONDS + 120))
          pages=("" install configuration rules sarif github-action architecture contributing hackathon)
          while (( SECONDS < deadline )); do
            ok=true
            for page in "${pages[@]}"; do
              name="${page:-index}"
              curl --fail --silent --show-error --location --max-time 10 \
                "${base}${page:+$page/}" -o "$temporary/$name.html" || ok=false
            done
            if [[ "$ok" == true ]]; then
              for number in {001..011}; do
                grep -q "id=\"sent-$number\"" "$temporary/rules.html" || ok=false
              done
            fi
            [[ "$ok" == true ]] && exit 0
            sleep 5
          done
          echo "Documentation smoke check did not pass within two minutes" >&2
          exit 1
