name: False positive
description: Report a reproducible Sentinel finding that should not be emitted.
title: '[False positive] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Submit only sanitized, publicly shareable evidence. For sensitive Sentinel vulnerabilities,
        use [private reporting](https://github.com/BashaarJavaid/MCP-Sentinel/security/advisories/new).
        For third-party vulnerabilities, follow the upstream security policy before public
        disclosure. Reporter expectations are unreviewed proposals; maintainers review labels
        and changes. See the [maintenance process](https://bashaarjavaid.github.io/MCP-Sentinel/phase23-maintenance/).
  - type: input
    id: version
    attributes:
      label: Sentinel version
      description: Paste sentinel --version and the commit if using a source checkout.
      placeholder: Version or exact commit
    validations:
      required: true
  - type: dropdown
    id: rule
    attributes:
      label: Rule
      options:
        - SENT-001
        - SENT-002
        - SENT-003
        - SENT-004
        - SENT-005
        - SENT-006
        - SENT-007
        - SENT-008
        - SENT-009
        - SENT-010
        - SENT-011
        - SENT-012
        - SENT-013
        - SENT-014
        - SENT-015
        - SENT-016
    validations:
      required: true
  - type: input
    id: language-framework
    attributes:
      label: Language and framework
      placeholder: Python 3.12 with FastMCP 1.x
    validations:
      required: true
  - type: textarea
    id: command-configuration
    attributes:
      label: Command and configuration
      description: Include the exact command and sanitized configuration, scan mode, rule
        selection, ignores, baselines and suppressions. Remove credentials and internal endpoints.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Redacted finding
      description: Include the matching finding and complete sanitized JSON/SARIF report,
        exit status, diagnostics and analysis/support status. Link a sanitized attachment
        if needed.
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted minimal reproduction
      description: Provide minimal publicly shareable source, manifests and relevant SDK versions.
        Include a vulnerable counterpart if known, or say unavailable. Do not execute an unsafe
        target to report it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Reporter expectation (unreviewed)
      description: Explain the exact source condition that makes this finding a false positive,
        including file/line evidence. Maintainers must review the label.
    validations:
      required: true
  - type: textarea
    id: source-rights
    attributes:
      label: Source provenance and reuse rights
      description: Give public source URLs, immutable revisions, file paths and applicable
        license/notice links. For your own examples, state authorship. If rights are unknown,
        say unknown. Public posting alone does not authorize corpus reuse.
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Sensitive data confirmation
      options:
        - label: I removed secrets, credentials, personal data, internal endpoints and private
            source, and this report is suitable for public disclosure.
          required: true
  - type: checkboxes
    id: example-reuse
    attributes:
      label: Optional example reuse consent
      description: This is separate from sanitization and is not required to report an issue.
        Without consent or an applicable license, maintainers must obtain permission before
        incorporating examples.
      options:
        - label: I have the right to license my submitted examples and permit their reuse
            and modification in Sentinel's regression corpus under the project's MIT license.
          required: false
