site_name: PortunusMCP Sentinel
site_url: https://bashaarjavaid.github.io/MCP-Sentinel/
repo_url: https://github.com/BashaarJavaid/MCP-Sentinel
repo_name: BashaarJavaid/MCP-Sentinel
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Install: install.md
  - Scan a real MCP server before release: walkthrough.md
  - Configuration: configuration.md
  - Rules: rules.md
  - SARIF: sarif.md
  - GitHub Action: github-action.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Project history: hackathon.md
