language: python
launch_cmd: [python, server.py]
install_cmd: [python, -m, pip, install, -r, requirements.txt]
transport: stdio
working_dir: .
env: {}
env_from: []
python_version: "3.11"
probe_baselines:
  broad_reader: {path: data/users.json}
  unsafe_calculator: {expression: "1"}
  unchecked_lookup: {arguments: {record_id: sentinel-record}}
  ungranted_echo: {value: sentinel}
