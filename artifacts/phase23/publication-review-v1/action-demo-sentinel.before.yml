name: MCP Sentinel proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  clean:
    name: Clean target passes
    runs-on: ubuntu-latest
    steps:
      - name: Check out proof targets
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Scan clean target
        id: sentinel
        uses: BashaarJavaid/MCP-Sentinel@v1
        with:
          target-path: clean_server
          fail-on: high
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Verify clean outputs
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.sentinel.outcome }}
          SARIF_PATH: ${{ steps.sentinel.outputs.sarif-path }}
          FINDINGS_COUNT: ${{ steps.sentinel.outputs.findings-count }}
          HIGHEST_SEVERITY: ${{ steps.sentinel.outputs.highest-severity }}
        run: |
          [[ "$STEP_OUTCOME" == "success" ]]
          python verify_action_outputs.py \
            "$SARIF_PATH" "$FINDINGS_COUNT" "$HIGHEST_SEVERITY" \
            --require-complete
          [[ "$FINDINGS_COUNT" == "0" ]]
          [[ "$HIGHEST_SEVERITY" == "none" ]]

      - name: Preserve clean SARIF
        if: always() && steps.sentinel.outputs.sarif-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-clean-sarif
          path: ${{ steps.sentinel.outputs.sarif-path }}
          retention-days: 90
          if-no-files-found: error

  vulnerable:
    name: Vulnerable target fails its threshold
    runs-on: ubuntu-latest
    steps:
      - name: Check out proof targets
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Scan vulnerable target
        id: sentinel
        continue-on-error: true
        uses: BashaarJavaid/MCP-Sentinel@v1
        with:
          target-path: vulnerable_server
          fail-on: high
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Verify expected threshold failure and outputs
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.sentinel.outcome }}
          SARIF_PATH: ${{ steps.sentinel.outputs.sarif-path }}
          FINDINGS_COUNT: ${{ steps.sentinel.outputs.findings-count }}
          HIGHEST_SEVERITY: ${{ steps.sentinel.outputs.highest-severity }}
        run: |
          [[ "$STEP_OUTCOME" == "failure" ]]
          python verify_action_outputs.py \
            "$SARIF_PATH" "$FINDINGS_COUNT" "$HIGHEST_SEVERITY" \
            --require-complete --expect-all-rules
          [[ "$FINDINGS_COUNT" == "11" ]]
          [[ "$HIGHEST_SEVERITY" == "critical" ]]

      - name: Preserve vulnerable SARIF
        if: always() && steps.sentinel.outputs.sarif-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-vulnerable-sarif
          path: ${{ steps.sentinel.outputs.sarif-path }}
          retention-days: 90
          if-no-files-found: error
